<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spela – Tänd ett ljus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/game.css">
</head>
<body class="game">
  <main>
    <div class="game-area">
    <div class="hud">
      <div class="hud__item"><span class="hud__label">Tid</span><span class="hud__value" id="time">30</span></div>
      <div class="hud__item"><span class="hud__label">Nivå</span><span class="hud__value" id="level">1/3</span></div>
      <div class="hud__item"><span class="hud__label">Poäng</span><span class="hud__value" id="score">0</span></div>
      <div class="hud__item"><span class="hud__label">Hjärtan</span><span class="hud__value" id="hearts">3</span></div>
    </div>
    <div class="board-wrap" id="board-wrap">
      <svg id="board" class="game-board" role="group" aria-label="Spelbräde"></svg>
      <!-- Hidden at first. Shown when the game ends, or if the game could not start. -->
      <div class="board-overlay" id="overlay" hidden>
        <p id="end-text" class="board-overlay__text"></p>
        <button id="start" class="button" type="button" hidden>Försök igen</button>
      </div>
    </div>
    <p id="message" class="game-message" role="status"></p>
    </div>
  </main>
  <script type="module" src="js/pages/play.js"></script>
</body>
</html>
