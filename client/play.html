<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spela – Tänd ett ljus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/game.css">
</head>
<body class="game">
  <main>
    <div class="hud">
      <span>Poäng: <span id="score">0</span></span>
      <span class="hud__hearts">Hjärtan: <span id="hearts">3</span></span>

    <svg id="board" class="game-board" role="group" aria-label="Spelbräde"></svg>
    <p id="message" class="game-message" role="status"></p>
  </main>
  <script type="module" src="js/pages/play.js"></script>

</html>
